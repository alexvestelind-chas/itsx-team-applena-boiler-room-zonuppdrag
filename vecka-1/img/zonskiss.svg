<svg width="680" height="366" viewBox="0 0 680 366" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Zonskiss för nätverket</title>
<desc>Diagram som visar Internet, DMZ, Klientzon, Applikationszon, Gästzon, Datazon och Hanteringszon samt huvudflödet mellan dem.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="366" fill="#ffffff"/>

<rect x="300" y="20" width="160" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="380" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Internet</text>

<line x1="380" y1="56" x2="380" y2="90" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="300" y="90" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="380" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">DMZ</text>
<text x="380" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Webbserver</text>

<line x1="380" y1="146" x2="380" y2="180" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="60" y="180" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Klientzon</text>
<text x="140" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">30 arbetsplatser</text>

<path d="M220 208 L300 118" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="300" y="180" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="380" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Applikationszon</text>
<text x="380" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">App-server</text>

<rect x="480" y="180" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="555" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Gästzon</text>
<text x="555" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Endast internet</text>

<line x1="380" y1="236" x2="380" y2="270" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="300" y="270" width="160" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="380" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B1528">Datazon</text>
<text x="380" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#72243E">Kunddatabas</text>

<rect x="480" y="270" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="555" y="290" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Hanteringszon</text>
<text x="555" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Jump + logg</text>
</svg>
